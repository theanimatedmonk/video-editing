<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #0a0a0a;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      .shot {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .shot video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      /* soft paper vignette over every shot */
      #vignette {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(20, 16, 30, 0.45) 100%);
      }
      #flash {
        position: absolute;
        inset: 0;
        background: #fffaf0;
        opacity: 0;
        pointer-events: none;
      }
      #fade-out {
        position: absolute;
        inset: 0;
        background: #fffaf0;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-199x" id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <!-- Shot 1: hero, flowers on the shore -->
      <div data-hf-id="hf-gipf" class="shot" id="s1-wrap">
        <video data-hf-id="hf-v5ed" id="s1" src="assets/lake-full.mp4" data-start="0" data-duration="2" data-media-start="0.3" data-playback-rate="1.25" data-track-index="0" muted playsinline></video>
      </div>
      <!-- Shot 2: sweep toward the lotus beds -->
      <div data-hf-id="hf-7lui" class="shot" id="s2-wrap">
        <video data-hf-id="hf-akk9" id="s2" src="assets/lake-full.mp4" data-start="2" data-duration="1.5" data-media-start="8.6" data-playback-rate="1.5" data-track-index="0" muted playsinline></video>
      </div>
      <!-- Shot 3: low skim over the water -->
      <div data-hf-id="hf-v21p" class="shot" id="s3-wrap">
        <video data-hf-id="hf-gemw" id="s3" src="assets/lake-full.mp4" data-start="3.5" data-duration="1.5" data-media-start="13" data-playback-rate="1.3" data-track-index="0" muted playsinline></video>
      </div>
      <!-- Shot 4: crane up to the valley -->
      <div data-hf-id="hf-fyj0" class="shot" id="s4-wrap">
        <video data-hf-id="hf-zt6z" id="s4" src="assets/lake-full.mp4" data-start="5" data-duration="1.5" data-media-start="18" data-playback-rate="1.5" data-track-index="0" muted playsinline></video>
      </div>
      <!-- Shot 5: past the tree -->
      <div data-hf-id="hf-lfn3" class="shot" id="s5-wrap">
        <video data-hf-id="hf-rn9g" id="s5" src="assets/lake-full.mp4" data-start="6.5" data-duration="1.5" data-media-start="34.6" data-playback-rate="1.5" data-track-index="0" muted playsinline></video>
      </div>
      <!-- Shot 6: lotus beds and sun -->
      <div data-hf-id="hf-3m8m" class="shot" id="s6-wrap">
        <video data-hf-id="hf-e7oe" id="s6" src="assets/lake-full.mp4" data-start="8" data-duration="2" data-media-start="24" data-playback-rate="1" data-track-index="0" muted playsinline></video>
      </div>

      <div data-hf-id="hf-h7i3" id="vignette"></div>


      <div data-hf-id="hf-hmg5" id="flash"></div>
      <div data-hf-id="hf-ltmw" id="fade-out"></div>

      <audio data-hf-id="hf-13f7" id="music" src="assets/Astral Generated Music 3b469041.wav" data-start="0" data-duration="10" data-track-index="10" data-volume="0.9" data-automation="{&quot;version&quot;:1,&quot;lanes&quot;:[{&quot;target&quot;:&quot;volume&quot;,&quot;points&quot;:[{&quot;t&quot;:0,&quot;v&quot;:0},{&quot;t&quot;:0.4,&quot;v&quot;:1},{&quot;t&quot;:8.8,&quot;v&quot;:1},{&quot;t&quot;:10,&quot;v&quot;:0}]}]}"></audio>
      <audio data-hf-id="hf-aatn" id="whoosh-1" src="assets/Fast airy whoosh.mp3" data-start="1.55" data-duration="1.42" data-track-index="11" data-volume="0.5"></audio>
      <audio data-hf-id="hf-xrih" id="whoosh-2" src="assets/Fast airy whoosh.mp3" data-start="7.55" data-duration="1.42" data-track-index="12" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });

      // Each shot: slow camera push, plus a small punch as it lands on the cut
      const shots = [
        { id: "#s1-wrap", t: 0, d: 2, from: 1.025, to: 1.0 },
        { id: "#s2-wrap", t: 2, d: 1.5, from: 1.025, to: 1.0 },
        { id: "#s3-wrap", t: 3.5, d: 1.5, from: 1.0, to: 1.025 },
        { id: "#s4-wrap", t: 5, d: 1.5, from: 1.025, to: 1.0 },
        { id: "#s5-wrap", t: 6.5, d: 1.5, from: 1.0, to: 1.025 },
        { id: "#s6-wrap", t: 8, d: 2, from: 1.025, to: 1.0 },
      ];
      shots.forEach((s) => {
        tl.fromTo(s.id, { scale: s.from }, { scale: s.to, duration: s.d, ease: "power2.out" }, s.t);
      });

      // Light flash on every cut
      [2, 3.5, 5, 6.5, 8].forEach((c) => {
        tl.fromTo("#flash", { opacity: 0.55 }, { opacity: 0, duration: 0.35, ease: "power2.out", immediateRender: false }, c);
      });
      // Blur kick on the whoosh cuts
      [["#s2-wrap", 2], ["#s6-wrap", 8]].forEach(([id, c]) => {
        tl.fromTo(id, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.4, ease: "power3.out", immediateRender: false }, c);
      });

      // Wash to paper at the very end
      tl.fromTo("#fade-out", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.in" }, 9.5);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
