    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; position: relative; overflow: hidden; background: #000; }

      /* Each shot: the recording is framed so the app's side panel stays off-screen. */
      .shot { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .shot-frame { position: absolute; left: 0; top: -108px; width: 2340px; height: 1296px; transform-origin: 0% 50%; }
      .shot video { position: absolute; left: 0; top: 0; width: 2340px; height: 1296px; object-fit: cover; }

      /* Cinematic finish */
      .vignette { position: absolute; inset: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 55%, rgba(10,4,0,0.55) 100%); }
      .blackout { position: absolute; inset: 0; background: #000; pointer-events: none; }

    </style>
  </head>
  <body>

    <script>
      const tl = gsap.timeline({ paused: true });

      // Shots: dissolve in, slow push the whole time
      const shots = [
        ["#shot-1", 0, 5.2, 1.8],
        ["#shot-2", 3.7, 6.3, 1.5],
        ["#shot-3", 8.5, 12.5, 1.5],
        ["#shot-4", 19.5, 6.7, 1.5],
        ["#shot-5", 24.7, 5.3, 1.5],
      ];
      shots.forEach(([sel, start, dur, fade]) => {
        tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: fade, ease: "sine.inOut" }, start);
        tl.fromTo(sel + " .shot-frame", { scale: 1 }, { scale: 1.07, duration: dur, ease: "none" }, start);
      });

      // Open from black, close to black
      tl.fromTo("#blackout", { opacity: 1 }, { opacity: 0, duration: 1.6, ease: "sine.out" }, 0);
      tl.to("#blackout", { opacity: 1, duration: 2, ease: "sine.inOut" }, 28);


      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
