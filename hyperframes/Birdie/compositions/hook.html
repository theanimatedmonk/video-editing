      <script>
        const tl = gsap.timeline({ paused: true });
        // Lines drift in softly, keep gliding left at a steady pace, then glitch away.
        function glitchOut(el, out, key) {
          let seed = 0;
          for (const ch of key) seed = (seed * 31 + ch.charCodeAt(0)) % 2147483647;
          seed = seed || 7;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const band = () => { const top = Math.floor(rnd() * 80); return [top + "%", Math.max(0, 100 - top - 8 - Math.floor(rnd() * 30)) + "%"]; };
          const FLICKER = [1, 0.85, 1, 0.55, 0.9, 0.4, 0.75, 0.25, 0.6, 0.15, 0.35, 0.08, 0.2, 0.04, 0];
          FLICKER.forEach((o, i) => {
            const [t1, b1] = band(), [t2, b2] = band();
            const amp = 8 + i * 4;
            tl.set(el, {
              opacity: o,
              skewX: (rnd() - 0.5) * 14,
              "--ga": i < FLICKER.length - 1 ? 0.95 : 0,
              "--gx1": ((rnd() - 0.5) * 2 * amp).toFixed(1) + "px",
              "--gx2": ((rnd() - 0.5) * 2 * amp).toFixed(1) + "px",
              "--gt1": t1, "--gb1": b1, "--gt2": t2, "--gb2": b2,
            }, out + i / 30);
          });
        }
        // A line broken over several rows: each row lands in turn, the block glides as one, rows glitch out together.
        function stackLife(carrySel, rowSels, at, out, gap) {
          tl.set(carrySel, { x: 0 }, 0);
          tl.to(carrySel, { x: -80, duration: out + 0.5 - at, ease: "none" }, at);
          rowSels.forEach((sel, k) => {
            const el = document.querySelector(sel);
            tl.fromTo(el, { x: 56, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, at + k * gap);
            glitchOut(el, out + k * 0.04, sel);
          });
        }
        // The rig arrives already moving left (cut-the-curve entry)
        tl.fromTo("#hook-strip", { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.42, ease: "power4.out", immediateRender: true }, 0);
        // 1. The mic in hand scales up until it fills the screen
        tl.fromTo("#hook-mic", { scale: 1, borderRadius: 30 }, { scale: 4.6, borderRadius: 7, duration: 1.2, ease: "expo.inOut" }, 0.45);
        tl.to("#hook-mic", { scale: 5.3, duration: 0.9, ease: "power2.in" }, 1.65);
        tl.to("#hook-mic", { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.05);
        // 2. The breadboard card lands over it, then scales up to fill the screen too
        tl.fromTo("#hook-board", { opacity: 0, x: 230, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.5, ease: "power3.out" }, 2.0);
        tl.fromTo("#hook-board", { borderRadius: 30 }, { scale: 3.15, borderRadius: 10, duration: 0.95, ease: "expo.inOut", immediateRender: false }, 2.5);
        tl.to("#hook-board", { scale: 3.5, duration: 1.2, ease: "power1.in" }, 3.45);
        stackLife("#hook-carry", ["#hk-1", "#hk-2", "#hk-3"], 0.3, 2.7, 0.25);
        // a soft shade behind the question while the photo fills the frame, so the words stay readable
        tl.fromTo("#hook-scrim", { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.7);
        tl.to("#hook-scrim", { opacity: 0, duration: 0.5, ease: "power2.in" }, 2.75);
        // Birds swoop in over the mic, banking along their arcs, then scatter as the shot moves on
        tl.fromTo("#hook-birds", { y: 560 }, { y: 612, duration: 0.6, ease: "power2.out" }, 1.05);
        const ARCS = [[-205, 150], [-130, 125], [-80, 115]];
        ARCS.forEach(([a0, span], i) => {
          const at = 1.05 + i * 0.12, dur = 1.5 - i * 0.12, a1 = a0 + span;
          const bank = (a) => -0.4 * a + 54;
          tl.fromTo("#hb-bird-" + i, { scale: 0.2, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.5)" }, at);
          tl.fromTo("#hb-orbit-" + i, { rotate: a0 }, { rotate: a1, duration: dur, ease: "power1.inOut" }, at);
          tl.fromTo("#hb-bank-" + i, { rotate: bank(a0) }, { rotate: bank(a1), duration: dur, ease: "power1.inOut" }, at);
          tl.fromTo("#hb-level-" + i, { rotate: -a0 }, { rotate: -a1, duration: dur, ease: "power1.inOut" }, at);
          // wings beat the whole time; the far wing follows a beat behind
          tl.fromTo("#hb-bird-" + i + " .hb-wing", { scaleY: 1, transformOrigin: "86px 52px" }, { scaleY: -0.55, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 15 }, at);
          tl.fromTo("#hb-bird-" + i + " .hb-wing-far", { scaleY: 1, transformOrigin: "84px 52px" }, { scaleY: -0.4, duration: 0.09, ease: "sine.inOut", yoyo: true, repeat: 15 }, at + 0.03);
          // scatter outward
          tl.to("#hb-rad-" + i, { x: 900, duration: 0.45, ease: "power2.in" }, 2.2 + i * 0.05);
          tl.to("#hb-bird-" + i, { opacity: 0, duration: 0.3, ease: "power1.in" }, 2.32 + i * 0.05);
        });
        // chirps pop off the birds in time with the sound
        [[0, 1.12], [1, 1.32], [2, 1.55], [0, 1.78], [1, 2.0]].forEach(([i, t]) => {
          tl.fromTo("#hb-chirp-" + i, { scale: 0.4, opacity: 0 }, { scale: 1.15, opacity: 1, duration: 0.14, ease: "power2.out", immediateRender: false }, t);
          tl.to("#hb-chirp-" + i, { opacity: 0, scale: 1.4, duration: 0.2, ease: "power1.in" }, t + 0.14);
        });
        // Cut-the-curve exit to the left
        tl.to("#hook-strip", { x: -230, duration: 0.33, ease: "power4.in" }, 4.67);
        tl.to("#hook-strip", { opacity: 0, duration: 0.31, ease: "power2.in" }, 4.67);
        // horizontal motion blur peaks as the cut lands
        tl.fromTo("#hb-hook-blur", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "10 0" }, duration: 0.33, ease: "power4.in", immediateRender: false }, 4.67);
        window.__timelines["hook"] = tl;
