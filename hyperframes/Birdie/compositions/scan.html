<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
  </head>
  <body>
    <template>
      <style>
        #scan {
          position: absolute;
          inset: 0;
        }
      </style>
      <div data-hf-id="hf-8lmd" id="scan" data-composition-id="scan" data-width="1920" data-height="1080">
        <div data-hf-id="hf-gg8n" class="copy" id="scan-copy" style="left: 150px; top: 330px">
          <div data-hf-id="hf-ztoh" class="headline" id="scan-1" style="position: absolute; top: 0">
            <div data-hf-id="hf-3fv7" class="line" data-layout-allow-overflow=""><span data-hf-id="hf-z5go" class="w">Hear</span><span data-hf-id="hf-b7a3" class="w">a</span><span data-hf-id="hf-w3wg" class="w accent">call.</span></div>
          </div>
          <div data-hf-id="hf-mk80" class="headline" id="scan-2" style="position: absolute; top: 0">
            <div data-hf-id="hf-r69f" class="line" data-layout-allow-overflow=""><span data-hf-id="hf-67wj" class="w">Watch</span><span data-hf-id="hf-cqxh" class="w">it</span></div>
            <div data-hf-id="hf-qrye" class="line" data-layout-allow-overflow=""><span data-hf-id="hf-ewx6" class="w teal">come</span><span data-hf-id="hf-r0b3" class="w teal">alive.</span></div>
          </div>
          <div data-hf-id="hf-jbrm" id="scan-3" style="position: absolute; top: 0">
            <div data-hf-id="hf-qgjm" class="kicker line" data-layout-allow-overflow=""><div data-hf-id="hf-bkdm" class="w-k">Identified</div></div>
            <div data-hf-id="hf-x1ik" class="headline" style="margin-top: 20px">
              <div data-hf-id="hf-qdnd" class="line" data-layout-allow-overflow=""><span data-hf-id="hf-t013" class="w">Indian</span><span data-hf-id="hf-1gvc" class="w accent">Roller.</span></div>
            </div>
          </div>
        </div>
        <div data-hf-id="hf-3dca" class="phone" data-layout-allow-overflow="" id="phone-scan" style="left: 1230px">
          <video data-hf-id="hf-ir9h" id="v-scan" class="clip" src="assets/birdwatch.mp4" playsinline data-has-audio="true" data-start="0" data-duration="7" data-media-start="7.5" data-playback-rate="1.5" data-volume="0.7" data-track-index="0" style="left: -80px; top: -38px"></video>
        </div>
      </div>
      <script>
      const tl = gsap.timeline({ paused: true });
      const words = (sel) => gsap.utils.toArray(sel + " .w, " + sel + " .w-k");
      const rise = (sel, at, stagger = 0.06) =>
        tl.fromTo(words(sel), { yPercent: 110, rotate: 4 }, { yPercent: 0, rotate: 0, duration: 0.55, ease: "expo.out", stagger }, at);
      const sink = (sel, at) =>
        tl.to(words(sel), { yPercent: -110, duration: 0.3, ease: "power3.in", stagger: 0.03 }, at)
          .set(sel, { opacity: 0 }, at + 0.4);
      const show = (sel, at) => tl.fromTo(sel, { opacity: 0 }, { opacity: 1, duration: 0.01, immediateRender: true }, at);
      tl.fromTo("#phone-scan", { scale: 0.6, y: 120, rotate: 6, filter: "blur(16px)" }, { scale: 1, y: 0, rotate: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, 0);
      tl.to("#phone-scan", { y: -14, duration: 5.9, ease: "sine.inOut" }, 0.7);
      show("#scan-1", 0.2);
      rise("#scan-1", 0.2);
      sink("#scan-1", 2.0);
      show("#scan-2", 2.3);
      rise("#scan-2", 2.3);
      sink("#scan-2", 4.2);
      show("#scan-3", 4.5);
      rise("#scan-3", 4.5);
      tl.to("#phone-scan", { boxShadow: "0 50px 140px rgba(0,0,0,0.7), 0 0 160px rgba(111,227,208,0.55)", duration: 0.6, ease: "power2.out" }, 4.7);
      // whip the phone across to the left, where the next phone lands
      tl.to("#scan-copy", { x: -300, opacity: 0, filter: "blur(20px)", duration: 0.35, ease: "power3.in" }, 6.65);
      tl.to("#phone-scan", { x: -930, filter: "blur(28px)", duration: 0.35, ease: "power3.in" }, 6.65);
        window.__timelines["scan"] = tl;
      </script>
    </template>
  </body>
</html>
