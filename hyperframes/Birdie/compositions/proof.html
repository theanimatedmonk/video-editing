      <script>
        const tl = gsap.timeline({ paused: true });
        // Lines drift in softly, keep gliding left at a steady pace, then glitch away.
        function lineLife(sel, at, out) {
          const el = document.querySelector(sel);
          const carry = el.parentElement;
          const end = out + 0.5;
          tl.set(carry, { x: 0 }, 0);
          tl.to(carry, { x: -80, duration: end - at, ease: "none" }, at);
          tl.fromTo(el, { x: 56, opacity: 0, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.9, ease: "power3.out" }, at);
          let seed = 0;
          for (const ch of sel) seed = (seed * 31 + ch.charCodeAt(0)) % 2147483647;
          seed = seed || 7;
          const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
          const band = () => { const top = Math.floor(rnd() * 80); return [top + "%", Math.max(0, 100 - top - 8 - Math.floor(rnd() * 30)) + "%"]; };
          const FLICKER = [1, 0.85, 1, 0.55, 0.9, 0.4, 0.75, 0.25, 0.6, 0.15, 0.35, 0.08, 0.2, 0.04, 0];
          FLICKER.forEach((o, i) => {
            const [t1, b1] = band(), [t2, b2] = band();
            const amp = 8 + i * 4;
            tl.set(el, {
              opacity: o,
              skewX: (rnd() - 0.5) * 14,
              "--ga": i < FLICKER.length - 1 ? 0.95 : 0,
              "--gx1": ((rnd() - 0.5) * 2 * amp).toFixed(1) + "px",
              "--gx2": ((rnd() - 0.5) * 2 * amp).toFixed(1) + "px",
              "--gt1": t1, "--gb1": b1, "--gt2": t2, "--gb2": b2,
            }, out + i / 30);
          });
        }
        // --- phone: the app listens and names the bird ---
        tl.fromTo("#proof-phone", { x: 230, opacity: 0.35 }, { x: 0, opacity: 1, duration: 0.4, ease: "power4.out", immediateRender: true }, 0);
        tl.fromTo("#hb-proof-blur", { attr: { stdDeviation: "10 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.4, ease: "power4.out", immediateRender: true }, 0);
        lineLife("#proof-line", 0.45, 2.2);
        // zoom-through: push past the named bird into the count
        tl.to("#proof-phone", { scale: 1.2, filter: "blur(14px)", duration: 0.3, ease: "power3.in" }, 5.6);
        tl.to("#proof-phone", { opacity: 0, duration: 0.25, ease: "power2.in" }, 5.65);

        // --- pixel fronts: deterministic lattices of squares ---
        let seed = 11;
        const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
        document.querySelectorAll("#proof .m-band").forEach((band) => {
          for (let y = 0; y < 220; y += 14) for (let x = 0; x < 48; x += 14) {
            if (rnd() < 0.45) continue;
            const s = document.createElement("div");
            s.className = "m-px";
            s.style.left = x + "px";
            s.style.top = y + 6 + "px";
            s.style.opacity = (0.35 + rnd() * 0.65).toFixed(2);
            band.appendChild(s);
          }
        });
        const W = document.getElementById("m-count").offsetWidth;

        // --- the count resolves left to right inside a widening hairline panel ---
        const T = 6.0, P0 = 5.72;
        tl.fromTo("#m-panel", { opacity: 0, scaleX: 0.2 }, { opacity: 1, scaleX: 1, duration: 0.9, ease: "expo.out" }, P0);
        tl.fromTo(".m-rule", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, P0);
        tl.fromTo("#m-rule-top", { y: 110 }, { y: 0, duration: 0.9, ease: "expo.out" }, P0);
        tl.fromTo("#m-rule-bot", { y: -110 }, { y: 0, duration: 0.9, ease: "expo.out" }, P0);
        tl.fromTo("#m-count-wrap", { scale: 0.55, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.75, ease: "power3.out" }, T + 0.05);
        tl.fromTo("#m-count", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.7, ease: "power2.out" }, T + 0.05);
        tl.fromTo("#m-band-r", { x: -24, opacity: 1 }, { x: W - 24, duration: 0.7, ease: "power2.out" }, T + 0.05);
        tl.to("#m-band-r", { opacity: 0, duration: 0.12, ease: "power1.in" }, T + 0.68);
        tl.fromTo("#m-plate", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T + 0.25);
        const dots = gsap.utils.toArray("#proof .m-dot");
        [[0, 3], [1, 4], [2, 5]].forEach((pair, k) =>
          tl.to([dots[pair[0]], dots[pair[1]]], { opacity: 1, duration: 0.1, ease: "none" }, T + 0.45 + k * 0.1));

        // --- it dissolves from both ends while the panel narrows into a square ---
        const D = T + 1.25;
        tl.to("#m-count", { clipPath: "inset(0% 50% 0% 50%)", duration: 0.45, ease: "power2.in" }, D);
        tl.fromTo("#m-band-a", { x: -24, opacity: 1 }, { x: W / 2 - 24, duration: 0.45, ease: "power2.in" }, D);
        tl.fromTo("#m-band-b", { x: W - 24, opacity: 1 }, { x: W / 2 - 24, duration: 0.45, ease: "power2.in" }, D);
        tl.to(["#m-band-a", "#m-band-b"], { opacity: 0, duration: 0.1, ease: "none" }, D + 0.4);
        tl.to("#m-count-wrap", { opacity: 0, duration: 0.1, ease: "none" }, D + 0.42);
        tl.to("#m-plate", { y: 90, opacity: 0, duration: 0.35, ease: "power2.in" }, D);
        tl.to(dots, { opacity: 0, duration: 0.15, ease: "none", stagger: 0.04 }, D + 0.05);
        tl.to("#m-panel", { scaleX: 0.36, scaleY: 1.2, duration: 0.55, ease: "power3.inOut" }, D + 0.05);
        tl.to(".m-rule", { opacity: 0, duration: 0.4, ease: "power2.in" }, D + 0.2);

        // --- eight logbook birds swirl in clockwise and orbit the badge ---
        const O = D + 0.35;
        tl.fromTo(".m-tile", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out" }, O);
        tl.fromTo(".m-radial", { x: 640 }, { x: 340, duration: 0.8, ease: "expo.out" }, O);
        // the swirl: fast, then a slow orbit that never stops; a second spin speeds the exit
        tl.fromTo(".m-spin", { rotate: -120 }, { rotate: 60, duration: 2.0, ease: "expo.out" }, O);
        tl.fromTo(".m-up2", { rotate: 120 }, { rotate: -60, duration: 2.0, ease: "expo.out" }, O);
        tl.fromTo(".m-spin2", { rotate: 0 }, { rotate: 150, duration: 1.5, ease: "power2.in" }, O + 1.5);
        tl.fromTo(".m-up3", { rotate: 0 }, { rotate: -150, duration: 1.5, ease: "power2.in" }, O + 1.5);
        // the badge discs grow at the centre while the panel square fades behind them
        tl.fromTo("#m-disc-out", { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, O + 0.3);
        tl.fromTo("#m-disc-in", { opacity: 0, scale: 0.45 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, O + 0.36);
        tl.to("#m-panel", { opacity: 0, duration: 0.5, ease: "power2.out" }, O + 0.4);
        // tiles leave clockwise, one after another, on an expanding orbit
        const X = O + 2.05;
        for (let i = 0; i < 8; i++) {
          const k = (i + 3) % 8;
          tl.to("#m-rad-" + k, { x: 1150, duration: 0.45, ease: "none" }, X + i * 0.05);
          tl.to("#m-tile-" + k, { opacity: 0, duration: 0.3, ease: "power1.in" }, X + 0.12 + i * 0.05);
        }
        // the badge glides out left as the mark sets off, blur peaking at the cut
        tl.to("#m-badge", { x: -230, duration: 0.33, ease: "power4.in" }, 10.17);
        tl.to("#m-badge", { opacity: 0, duration: 0.31, ease: "power2.in" }, 10.17);
        tl.fromTo("#hb-proof-blur", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "10 0" }, duration: 0.33, ease: "power4.in", immediateRender: false }, 10.17);
        window.__timelines["proof"] = tl;
      </script>
