      <script>
        (function () {
          const root = document.getElementById("compose");
          const q = (s) => root.querySelectorAll(s);
          const one = (s) => root.querySelector(s);
          const cur = one(".t-cursor");
          const tl = gsap.timeline({ paused: true });
          const swapVal = (sel, at) => {
            const v = root.querySelectorAll(sel + " .sel-val span");
            tl.to(v[0], { opacity: 0, duration: 0.15 }, at);
            tl.to(v[1], { opacity: 1, duration: 0.2 }, at + 0.1);
          };
          const swapBody = (from, to, at) => {
            tl.to(one(from), { opacity: 0, filter: "blur(6px)", duration: 0.3, ease: "power2.in" }, at);
            tl.fromTo(one(to), { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, at + 0.25);
            tl.fromTo(one(".glow"), { opacity: 0 }, { opacity: 1, duration: 0.2, yoyo: true, repeat: 1 }, at);
          };
          const pick = (menu, sel, at, x, y) => {
            tl.to(cur, { x: x, y: 840, duration: 0.45, ease: "power3.inOut" }, at - 0.55);
            tl.to(one(sel), { scale: 0.95, duration: 0.08, yoyo: true, repeat: 1 }, at - 0.1);
            tl.fromTo(one(menu), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, at);
            tl.to(cur, { y: y, duration: 0.35, ease: "power2.inOut" }, at + 0.15);
            tl.set(one(menu + " .m-pick"), { attr: { class: "t-mi m-pick is-hover" } }, at + 0.45);
            tl.to(one(menu), { opacity: 0, duration: 0.18 }, at + 0.7);
          };

          // 0: the window opens, empty, with the AI bar ready.
          tl.fromTo(one(".cw"), { opacity: 0, y: 30, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "expo.out" }, 0);
          tl.set(one(".subj"), { clipPath: "inset(0 100% 0 0)" }, 0);
          tl.set(one(".a-ask"), { clipPath: "inset(0 100% 0 0)" }, 0);
          tl.set(cur, { x: 1180, y: 700, opacity: 0 }, 0);

          // 0.6: the ask types in.
          tl.to(one(".a-hint"), { opacity: 0, duration: 0.15 }, 0.6);
          tl.to(one(".a-ask"), { clipPath: "inset(0 0% 0 0)", duration: 1.4, ease: "steps(46)" }, 0.65);
          tl.set(one(".a-send"), { attr: { class: "c-sendic a-send go" } }, 2.0);

          // 2.2: generating, then the draft writes itself.
          tl.to(one(".bar-a"), { opacity: 0, duration: 0.15 }, 2.2);
          tl.to(one(".bar-b"), { opacity: 1, duration: 0.15 }, 2.25);
          tl.fromTo(one(".gen"), { backgroundPosition: "100% 0" }, { backgroundPosition: "-100% 0", duration: 0.8, ease: "none", repeat: 1 }, 2.25);
          tl.to(one(".subj"), { clipPath: "inset(0 0% 0 0)", duration: 0.5, ease: "steps(24)" }, 2.4);
          tl.set(one(".v-casual"), { opacity: 1 }, 2.9);
          tl.fromTo(q(".v-casual p"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.35, stagger: 0.25, ease: "power2.out" }, 2.9);

          // 4.0: the bar becomes "Describe your change" with tone, length and language.
          tl.to(one(".bar-b"), { opacity: 0, duration: 0.15 }, 4.0);
          tl.to(one(".bar-space"), { height: 72, duration: 0.35, ease: "power3.out" }, 4.0);
          tl.to(one(".bar-c"), { opacity: 1, duration: 0.3 }, 4.15);
          tl.to(cur, { opacity: 1, duration: 0.2 }, 4.2);

          // 4.9 Friendly, 6.5 Short, 8.1 Español.
          pick(".menu-tone", ".sel-tone", 4.9, 330, 766);
          swapVal(".sel-tone", 5.6);
          swapBody(".v-casual", ".v-friendly", 5.6);
          pick(".menu-len", ".sel-len", 6.5, 448, 702);
          swapVal(".sel-len", 7.2);
          swapBody(".v-friendly", ".v-short", 7.2);
          pick(".menu-lang", ".sel-lang", 8.1, 566, 734);
          swapVal(".sel-lang", 8.8);
          swapBody(".v-short", ".v-spanish", 8.8);
          tl.to(cur, { x: 1150, y: 600, opacity: 0, duration: 0.6, ease: "power2.in" }, 9.3);

          // The Titan AI logo in its Processing state while the draft generates.
          const logoCanvas = one("#compose-logo-canvas");
          let logo = null;
          const logoReady = (window.TiaBlob
            ? window.TiaBlob.create(logoCanvas, { src: "assets/logo/titan-ai-mark.riv", artboard: "Logo", stateMachine: "Logo", drawSize: 1000, crop: window.TiaBlob.LOGO_TILE, triggers: [{ at: 0, name: "idle" }, { at: 0.6, name: "processing" }] }).then((b) => {
                logo = b;
              })
            : Promise.reject(new Error("TiaBlob missing"))
          ).catch((e) => console.warn("[compose] logo unavailable:", e.message));
          if (window.__hyperframes && window.__hyperframes.registerFrameSource) {
            window.__hyperframes.registerFrameSource({
              element: logoCanvas,
              ready: logoReady,
              render: (time) => {
                if (logo) logo.t = time + 1; // a second ahead, so it is already working when first seen
              },
            });
          }

          window.__timelines["screen-compose"] = tl;
        })();
      </script>
