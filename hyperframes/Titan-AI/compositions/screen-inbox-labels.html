      <script>
        (function () {
          const root = document.getElementById("inbox-labels");
          const q = (s) => root.querySelectorAll(s);
          const labelled = Array.from(q(".t-row:not(.r-new)"));
          const tl = gsap.timeline({ paused: true });

          // 0: a plain inbox, no labels yet.
          tl.fromTo(labelled, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, stagger: 0.035, ease: "power3.out" }, 0);
          tl.set(q(".t-row:not(.r-new) .t-chip"), { opacity: 0, scale: 0.5 }, 0);
          tl.set(q(".t-tab"), { opacity: 0, y: 8 }, 0);

          // Tiny circles burst out around a label as it lands. They live above the rows so nothing clips them.
          const list = root.querySelector(".t-list");
          const burst = (row, at, seed) => {
            const chip = row.querySelector(".t-chip");
            const cx = chip.offsetLeft + chip.offsetWidth / 2;
            const cy = row.offsetTop + row.offsetHeight / 2;
            const halfW = chip.offsetWidth / 2;
            for (let n = 0; n < 7; n++) {
              const dot = document.createElement("i");
              dot.className = "spark-dot";
              const size = 3 + ((n * 7 + seed * 3) % 3);
              dot.style.width = dot.style.height = `${size}px`;
              dot.style.left = `${cx}px`;
              dot.style.top = `${cy}px`;
              dot.style.background = getComputedStyle(chip).color;
              list.append(dot);
              const a = (n / 7) * Math.PI * 2 + seed * 0.9;
              const reach = 34 + ((n * 13 + seed * 5) % 30);
              // Out in a flash, gone almost as fast.
              tl.fromTo(dot,
                { x: Math.cos(a) * halfW * 0.6, y: Math.sin(a) * 6, scale: 1.3, opacity: 0 },
                { x: Math.cos(a) * (halfW + reach), y: Math.sin(a) * (14 + reach * 0.75), scale: 0.8, opacity: 1, duration: 0.2, ease: "expo.out" },
                at);
              tl.to(dot, { scale: 0, opacity: 0, duration: 0.08, ease: "none" }, at + 0.2);
            }
          };

          // 1.1: each email gets its label, top to bottom.
          labelled.forEach((row, i) => {
            const at = 1.1 + i * 0.17;
            tl.fromTo(row.querySelector(".flash"), { opacity: 0, xPercent: -60 }, { opacity: 1, xPercent: 30, duration: 0.35, ease: "power2.out" }, at);
            tl.to(row.querySelector(".flash"), { opacity: 0, duration: 0.35, ease: "power2.in" }, at + 0.3);
            tl.to(row.querySelector(".t-chip"), { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" }, at + 0.08);
            burst(row, at + 0.1, i);
          });

          // 3.8: "All mail" gives way to the label tabs.
          tl.to(q(".all-mail"), { opacity: 0, y: -8, duration: 0.3, ease: "power2.in" }, 3.8);
          tl.to(q(".t-tab"), { opacity: 1, y: 0, duration: 0.45, stagger: 0.06, ease: "power3.out" }, 3.95);

          // 4.6: the Respond tab filters the list.
          tl.to(q(".r-drop"), { height: 0, opacity: 0, borderBottomWidth: 0, duration: 0.55, stagger: 0.03, ease: "power3.inOut" }, 4.6);
          tl.to(q(".r-new"), { height: 62, borderBottomWidth: 1, duration: 0.55, stagger: 0.06, ease: "power3.out" }, 5.05);
          tl.fromTo(q(".r-new"), { opacity: 0 }, { opacity: 1, duration: 0.5, stagger: 0.06, ease: "power2.out" }, 5.15);

          window.__timelines["screen-inbox-labels"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
