          const one = (s) => root.querySelector(s);
          const tl = gsap.timeline({ paused: true });
          const type = (el, at, dur) => tl.fromTo(el, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: "steps(26)" }, at);
          const show = (el, at) => tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, at);

          // What Tia's blob is doing, by time (0 idle, 1 thinking, 2 retrieving, 3 executing, 4 planning, 5 done).
          const BLOB_STATES = [
            { at: 0, state: 0 },
            { at: 3.6, state: 1 },
            { at: 4.3, state: 2 },
            { at: 5.4, state: 0 },
            { at: 8.45, state: 4 },
            { at: 9.25, state: 3 },
            { at: 10.1, state: 5 },
            { at: 12.0, state: 0 },
          ];
          // The words beside the docked blob, in step with it.
          const STATUS = [
            [".st-think", 3.6, 4.3],
            [".st-look", 4.3, 5.4],
            [".st-plan", 8.45, 9.25],
            [".st-run", 9.25, 10.1],
          ];

          // Where the blob sits: on the welcome screen, then beside each of Tia's replies.
          // All in the chat's coordinates, so it scrolls with the conversation.
          const canvas = one(".tia-blob canvas");
          const chat = one(".tia-chat");
          const mid = one(".tia-mid");
          const offsetIn = (el) => {
            let x = 0, y = 0;
            for (let n = el; n && n !== chat && n !== mid; n = n.offsetParent) {
              x += n.offsetLeft;
              y += n.offsetTop;
            }
            return { x, y };
          };
          const orb = one(".tia-orb");
          const o = offsetIn(orb);
          const welcomeAt = { x: o.x + orb.offsetWidth / 2 - 56, y: o.y + orb.offsetHeight / 2 - 56 };
          const reply1 = offsetIn(one(".c-sum .t-tia-mark"));
          const reply2 = offsetIn(one(".c-done .t-tia-mark"));
          const scrollTo = 12 - offsetIn(one(".c-ask2")).y;
          const AVATAR = 56 / 112;
          // The words beside the blob sit where the reply's text will start.
          [[".st-think", reply1], [".st-look", reply1], [".st-plan", reply2], [".st-run", reply2]].forEach(([sel, at]) => {
            const el = one(".tia-status " + sel);
            el.style.left = `${at.x + 68}px`;
            el.style.top = `${at.y + 17}px`;
          });

          // 0.4: Tia opens over the inbox.
          tl.set(q(".in-typed"), { clipPath: "inset(0 100% 0 0)" }, 0);
          tl.set(one(".t-tia"), { xPercent: 101 }, 0);
          tl.to(q(".tia-bg"), { opacity: 0.3, filter: "blur(2px)", duration: 0.6, ease: "power2.out" }, 0.4);
          tl.to(one(".t-tia"), { xPercent: 0, duration: 0.7, ease: "expo.out" }, 0.4);
          tl.fromTo(q(".tia-welcome > *"), { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, stagger: 0.1, ease: "power2.out" }, 0.75);
          tl.fromTo(one(".tia-blob"), { x: welcomeAt.x, y: welcomeAt.y + 14, scale: 0.6, opacity: 0 }, { y: welcomeAt.y, scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.7);

          // 2.6: "Summarize my unread emails". The blob drops to its dock and gets to work.
          tl.to(one(".in-ph"), { opacity: 0, duration: 0.1 }, 2.6);
          type(one(".in-1"), 2.62, 0.8);
          tl.to(one(".in-1"), { opacity: 0, duration: 0.12 }, 3.6);
          tl.to(one(".in-ph"), { opacity: 1, duration: 0.2 }, 3.7);
          tl.to(one(".tia-welcome"), { opacity: 0, y: -16, duration: 0.3, ease: "power2.in" }, 3.55);
          tl.to(one(".tia-blob"), { x: reply1.x, y: reply1.y, scale: AVATAR, duration: 0.6, ease: "power3.inOut" }, 3.5);
          tl.fromTo(canvas, { scale: 1, transformOrigin: "50% 80%" }, { scale: 1.18, duration: 0.6, ease: "power3.inOut" }, 3.5);
          show(one(".tia-chat .t-bubble-user"), 3.7);
          tl.set(one(".c-sum"), { opacity: 1 }, 5.4);
          tl.fromTo(q(".c-sum .t-tia-mark, .c-sum .ln"), { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.3, stagger: 0.22, ease: "power2.out" }, 5.4);
          show(one(".c-acts"), 6.8);

          // 7.4: "Schedule a sync with Priya".
          tl.to(one(".in-ph"), { opacity: 0, duration: 0.1 }, 7.4);
          type(one(".in-2"), 7.42, 0.8);
          tl.to(one(".in-2"), { opacity: 0, duration: 0.12 }, 8.4);
          tl.to(one(".in-ph"), { opacity: 1, duration: 0.2 }, 8.5);
          tl.to(chat, { y: scrollTo, duration: 0.6, ease: "power3.inOut" }, 8.45);
          tl.to(one(".tia-blob"), { x: reply2.x, y: reply2.y, duration: 0.6, ease: "power3.inOut" }, 8.45);
          show(one(".c-ask2"), 8.5);
          show(one(".c-done"), 10.1);
          tl.fromTo(one(".c-event"), { opacity: 0, y: 14, scale: 0.97 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 10.4);

          STATUS.forEach(([sel, from, to]) => {
            tl.fromTo(one(".tia-status " + sel), { opacity: 0, x: -6 }, { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" }, from);
            tl.to(one(".tia-status " + sel), { opacity: 0, duration: 0.18 }, to - 0.18);
          });

          // The blob is a frame source: the renderer waits for it to load, then asks it for each frame's time.
          let blob = null;
          const ready = window.TiaBlob
            ? window.TiaBlob.create(canvas, { src: "assets/tia/blob.riv", states: BLOB_STATES }).then((b) => {
                blob = b;
              })
            : Promise.reject(new Error("TiaBlob missing"));
          const loaded = ready.catch((e) => console.warn("[tia] blob unavailable:", e.message));
          if (window.__hyperframes && window.__hyperframes.registerFrameSource) {
            window.__hyperframes.registerFrameSource({
              element: canvas,
              ready: loaded,
              render: (time) => {
                if (blob) blob.t = time;
              },
            });
          } else {
            // Older runtimes: drive it from this timeline instead.
            const driver = { get t() { return blob ? blob.t : 0; }, set t(v) { if (blob) blob.t = v; } };
            tl.fromTo(driver, { t: 0 }, { t: 18, duration: 18, ease: "none" }, 0);
          }

          window.__timelines["screen-tia"] = tl;
        });
      </script>
    </template>
  </body>
</html>
