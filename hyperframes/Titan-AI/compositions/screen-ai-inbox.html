      <script>
        (function () {
          const root = document.getElementById("ai-inbox");
          const q = (s) => root.querySelectorAll(s);
          const one = (s) => root.querySelector(s);
          const mails = Array.from(q(".p-mail"));
          const counts = Array.from(q(".p-count span"));
          const bars = Array.from(q(".t-progress i"));
          const queue = Array.from(q(".rq"));
          const respN = one(".resp-n");
          const tl = gsap.timeline({ paused: true });

          // 0: the three cards build in.
          tl.fromTo(q(".ai-card"), { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.6, stagger: 0.12, ease: "power3.out" }, 0.05);
          tl.fromTo(q(".ai-card .t-person"), { opacity: 0, x: -8 }, { opacity: 1, x: 0, duration: 0.4, stagger: 0.03, ease: "power2.out" }, 0.35);
          tl.set(q(".t-panel"), { xPercent: 101 }, 0);

          // 1.4: the pointer finds "Power through replies" and taps it.
          tl.fromTo(one(".t-pointer"), { x: 640, y: 560, opacity: 0 }, { x: 640, y: 560, opacity: 1, duration: 0.25 }, 1.2);
          const pointerHome = one(".t-pointer").offsetParent;
          let btnX = 0, btnY = 0;
          for (let n = one(".power-btn"); n && n !== pointerHome; n = n.offsetParent) {
            btnX += n.offsetLeft;
            btnY += n.offsetTop;
          }
          tl.to(one(".t-pointer"), { x: btnX + one(".power-btn").offsetWidth * 0.55, y: btnY + one(".power-btn").offsetHeight / 2, duration: 0.7, ease: "power3.inOut" }, 1.4);
          tl.to(one(".t-pointer"), { scale: 0.7, duration: 0.1, yoyo: true, repeat: 1 }, 2.15);
          tl.to(one(".power-btn"), { scale: 0.94, duration: 0.1, yoyo: true, repeat: 1 }, 2.15);
          tl.to(one(".t-pointer"), { opacity: 0, duration: 0.3 }, 2.45);

          // 2.4: the reply queue slides in.
          tl.to(q(".t-panel"), { xPercent: 0, duration: 0.7, ease: "expo.out" }, 2.4);

          // One email at a time: its reply types, it sends, the next one comes up.
          // Typing time and pause per email: the first ones read, the rest fly by.
          const beats = [
            { type: 0.7, hold: 0.3 },
            { type: 0.5, hold: 0.2 },
            { type: 0.3, hold: 0.1 },
            { type: 0.25, hold: 0.08 },
            { type: 0.25, hold: 0.08 },
            { type: 0.3, hold: 0.15 },
          ];
          let next = 2.6;
          beats.forEach((b) => {
            b.at = next;
            next = b.at + 0.3 + b.type + b.hold + 0.25;
          });
          beats.forEach((b, i) => {
            const m = mails[i];
            const lines = m.querySelectorAll(".t-type");
            tl.set(counts, { opacity: 0 }, b.at);
            tl.set(counts[i], { opacity: 1 }, b.at);
            tl.set(bars[i], { attr: { "data-on": "1" } }, b.at);
            tl.fromTo(m, { opacity: 0, x: 24 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, b.at);
            tl.fromTo(lines[0], { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: b.type * 0.3, ease: "none" }, b.at + 0.3);
            tl.fromTo(lines[1], { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: b.type * 0.7, ease: "none" }, b.at + 0.3 + b.type * 0.3);
            const sent = b.at + 0.3 + b.type + b.hold;
            tl.to(m.querySelector(".send-btn"), { scale: 0.92, duration: 0.08, yoyo: true, repeat: 1 }, sent - 0.1);
            tl.to(m, { opacity: 0, x: -24, duration: 0.16, ease: "power2.in" }, sent + 0.05);
            tl.to(queue[i], { height: 0, paddingTop: 0, paddingBottom: 0, opacity: 0, borderBottomWidth: 0, duration: 0.4, ease: "power3.inOut" }, sent);
            tl.set(respN, { textContent: String(5 - i) }, sent + 0.2);
          });

          // 9.0: queue done; the Respond card is empty and the greeting changes.
          tl.fromTo(one(".p-done"), { opacity: 0, scale: 0.94 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(1.6)" }, 9.0);
          tl.to(one(".caught"), { height: 40, paddingTop: 12, duration: 0.4, ease: "power3.out" }, 9.0);
          tl.to(one(".g-busy"), { opacity: 0, duration: 0.25 }, 9.0);
          tl.to(one(".g-done"), { opacity: 1, duration: 0.35 }, 9.15);

          window.__timelines["screen-ai-inbox"] = tl;
        })();
      </script>
