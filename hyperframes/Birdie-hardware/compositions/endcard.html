          const mod = await import(RIVE_URL + "canvas_advanced.mjs");
          const rive = await mod.default({ locateFile: () => RIVE_URL + "rive.wasm" });
          const bytes = Uint8Array.from(atob(BIRD_RIV), (c) => c.charCodeAt(0));
          const file = await rive.load(bytes);
          const artboard = file.artboardByName("Bird");
          const play = {
            fly: new rive.LinearAnimationInstance(artboard.animationByName("FlyIn"), artboard),
            idle: new rive.LinearAnimationInstance(artboard.animationByName("Idle"), artboard),
            off: new rive.LinearAnimationInstance(artboard.animationByName("TakeOff"), artboard),
          };
          const canvas = document.getElementById("end-rive");
          const renderer = rive.makeRenderer(canvas);
          const frame = { minX: 0, minY: 0, maxX: 1920, maxY: 1080 };
          const draw = (t) => {
            let inst, local;
            if (t < IDLE_AT) { inst = play.fly; local = Math.max(0, t - FLY_AT); }
            else if (t < OFF_AT) { inst = play.idle; local = (t - IDLE_AT) % IDLE_LEN; }
            else { inst = play.off; local = t - OFF_AT; }
            inst.time = local;
            inst.apply(1);
            artboard.advance(0);
            renderer.clear();
            renderer.save();
            renderer.align(rive.Fit.none, rive.Alignment.center, frame, artboard.bounds);
            artboard.draw(renderer);
            renderer.restore();
            rive.resolveAnimationFrame();
          };
          const clock = { t: 0 };
          tl.fromTo(clock, { t: 0 }, { t: 5.5, duration: 5.5, ease: "none", onUpdate: () => draw(clock.t) }, 0);
          draw(0);
          window.__timelines["endcard"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
